name: CI

on:
  pull_request:
    branches: [main, "release/**"]
  push:
    branches: [main, "release/**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, test and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history so changed files can be compared with the base branch.
          fetch-depth: 0
          # Pull request code runs in this job; don't leave the token in .git.
          persist-credentials: false

      # The docs pages are built from technical-docs, as on deploy.
      - name: Checkout technical-docs
        uses: actions/checkout@v7
        with:
          repository: Public-Health-Scotland/technical-docs
          path: .content-src/technical-docs
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint changed files
        env:
          # Pull requests compare with their target branch; pushes with the previous commit.
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: |
          if [ -z "$BASE_REF" ] || [ "$BASE_REF" = "0000000000000000000000000000000000000000" ]; then
            echo "No base to compare with; skipping changed-file lint."
          else
            npm run lint:changed -- "$BASE_REF"
          fi

      - name: Unit tests
        run: npm test

      # Reports problems in technical-docs on the job summary. Content problems
      # are fixed in technical-docs, so they never fail this repository's CI.
      - name: Check documentation content
        run: npm run docs:check -- --format github --advisory

      - name: Generate static site
        run: npm run generate

      - name: Install browser for end-to-end tests
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload test traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
